name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The bridge reads HealthKit's type catalog from the SDK on the build machine,
    # so the runner image needs to be recent. Bump this with the macOS release.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Build the app bundle (ad-hoc signed)
        run: scripts/build-app.sh --release

      - name: Verify the bundle
        run: |
          APP="dist/Flexpa Health Bridge.app"
          codesign --verify --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          # The CLI must run from the built bundle.
          "$APP/Contents/MacOS/HealthBridge" --version
